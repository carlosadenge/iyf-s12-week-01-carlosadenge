<body>

    <header>
        <h1>Carlos Adenge</h1>

            <ul>

                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contact Me</h2>

        <form action="#" method="post">
            <fieldset>
                <legend>Personal Information</legend>

                <label for="fullname">Full Name *</label><br>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required><br><br>

                <label for="email">Email *</label><br>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required><br><br>

                <label for="phone">Phone (optional)</label><br>
                <input type="tel" id="phone" name="phone" placeholder="+254 7XX XXX XXX"><br><br>
            </fieldset>

            <fieldset>
                <legend>Message Details</legend>

                <label for="subject">Subject *</label><br>
                <select id="subject" name="subject" required>
                    <option value="">-- Select a subject --</option>
                    <option value="general">General Inquiry</option>
                    <option value="project">Project Collaboration</option>
                    <option value="feedback">Feedback</option>
                </select>

                <label for="message">Message *</label><br>
                <textarea id="message" name="message" rows="6" placeholder="Write your message here (minimum 50 characters)" required minlength="50"></textarea><br><br>
            </fieldset>

            <label>
                <input type="checkbox" name="newsletter" value="yes">
                Subscribe to my newsletter
            </label><br><br>

            <button type="submit">Send Message</button>
        </form>

        <section>
            <h3>Other Ways to Reach Me</h3>
            <address>
                Email: <a href="mailto:carlosadenge@gmail.com">carlosadenge@gmail.com</a>
            </address>

            <p>
                <a href="https://github.com/carlosadenge">GitHub</a> |
                <a href="https://www.linkedin.com/in/carlosadenge">LinkedIn</a>
            </p>
        </section>
    </main>

    <footer>
        <p>2026 Carlos Adenge. All rights reserved.</p>
    </footer>

</body>
</html>
